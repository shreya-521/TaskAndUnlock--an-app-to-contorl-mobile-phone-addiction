name: task_and_unlock
description: A power-efficient app that blocks app access until physical exercises are completed.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  permission_handler: ^11.4.0
  camera: ^0.10.0+1
  google_mlkit_pose_detection: ^0.3.0
  flutter_local_notifications: ^16.1.0
  fl_chart: ^0.64.0
  workmanager: ^0.5.2
  app_usage: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
